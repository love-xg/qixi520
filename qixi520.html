<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七夕快乐，转我5.20</title>
<meta property="og:title" content="七夕快乐，转我5.20">
<meta property="og:description" content="七夕快乐，转我5.20 ❤️">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 45%, #ffd1ff 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    position: relative;
  }
  .heart {
    position: absolute;
    font-size: 22px;
    animation: floatUp 6s linear infinite;
    opacity: 0.75;
    pointer-events: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(105vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.8; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
  .card {
    position: relative;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(214, 69, 110, 0.25);
    max-width: 90vw;
    animation: pop 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.4);
  }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .big-heart { font-size: 64px; animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.2); }
  }
  h1 {
    font-size: 40px;
    color: #d6336c;
    margin: 16px 0 8px;
    letter-spacing: 4px;
  }
  .ask {
    font-size: 26px;
    color: #e64980;
    font-weight: bold;
    margin: 12px 0;
    letter-spacing: 2px;
  }
  .ask .amount {
    font-size: 34px;
    color: #ff3b6f;
    background: #ffe3ec;
    border-radius: 12px;
    padding: 4px 14px;
    display: inline-block;
    margin: 6px 0;
  }
  .hint { color: #a86a80; font-size: 15px; margin-top: 14px; }
  button {
    margin-top: 24px;
    border: none;
    background: linear-gradient(90deg, #ff6b9d, #ff3b6f);
    color: #fff;
    font-size: 18px;
    padding: 14px 36px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 8px 20px rgba(255, 59, 111, 0.35);
    transition: transform 0.15s;
  }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>
  <script>
    const emojis = ["❤️","💖","💘","🌹","✨","💝","🩷","🥰"];
    for (let i = 0; i < 26; i++) {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = (4 + Math.random() * 5) + "s";
      h.style.animationDelay = Math.random() * 5 + "s";
      document.body.appendChild(h);
    }
  </script>

  <div class="card">
    <div class="big-heart">💝</div>
    <h1>七夕快乐</h1>
    <div class="ask">
      <div class="amount">转我 5.20</div>
    </div>
    <div class="hint">520 = 赵丹是天底下最美的小仙女</div>
    <button onclick="navigator.clipboard && navigator.clipboard.writeText('5.20').then(()=>{this.textContent='已复制 5.20 ✅';})">
      复制「5.20」
    </button>
  </div>
</body>
</html>
